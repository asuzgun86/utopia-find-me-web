function plen(P){let L=0;for(let i=1;i<P.length;i++)L+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);return L}
function pat(P,s){for(let i=1;i<P.length;i++){const dx=P[i][0]-P[i-1][0],dy=P[i][1]-P[i-1][1],l=Math.hypot(dx,dy);if(s<=l||i==P.length-1){const f=l?Math.min(1,s/l):0;return{x:P[i-1][0]+dx*f,y:P[i-1][1]+dy*f,ang:Math.atan2(dy,dx)*180/Math.PI}}s-=l}return{x:P[0][0],y:P[0][1],ang:0}}
function arrowsSVG(pts){const P=poly(pts),L=plen(P);let s=`<polyline points="${P.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#0a84ff" stroke-opacity=".28" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`;for(let d=30;d<L-20;d+=55){const q=pat(P,d);s+=`<path d="M-9,-8 L8,0 L-9,8 L-4,0 Z" fill="#0a84ff" transform="translate(${q.x.toFixed(1)},${q.y.toFixed(1)}) rotate(${q.ang.toFixed(0)})"/>`}return s}
function walkerSVG(){return `<g id="wka" style="display:none"><path d="M-11,-11 L14,0 L-11,11 L-5,0 Z" fill="#ffd400" stroke="#8a6d00" stroke-width="1.5"/></g><g id="wkr" style="display:none"><g id="wks" transform="scale(1.45)"><ellipse cx="0" cy="1" rx="9" ry="3" fill="#000" opacity=".25"/><g id="mAR2"><rect x="-2" y="-27" width="3.6" height="12" rx="1.5" fill="#f1c27d"/></g><g id="mLG2"><rect x="-2.2" y="-14" width="4.4" height="14" rx="1.8" fill="#2b2f3a"/></g><rect x="-5.5" y="-28" width="11" height="15" rx="3" fill="#1f6feb"/><g id="mLG1"><rect x="-2.2" y="-14" width="4.4" height="14" rx="1.8" fill="#3a3f4d"/></g><g id="mAR1"><rect x="-1.6" y="-27" width="3.6" height="12" rx="1.5" fill="#e8b46c"/></g><circle cx="0" cy="-33" r="5.6" fill="#f1c27d"/><circle cx="2.4" cy="-34" r="1" fill="#222"/><path d="M-6,-41 L-6,-51 L9,-46 Z" fill="#ffd400" stroke="#8a6d00" stroke-width=".8"/></g></g>`}
function stopWalk2(){if(WALK){cancelAnimationFrame(WALK.raf);WALK=null}}
function startWalk2(){stopWalk2();if(!MROUTE)return;const R=MROUTE,legs=[R.a.d].concat(R.a.d!=R.b.d?[R.b.d]:[]);WALK={leg:0,s:0,legs,t0:performance.now(),pause:0,raf:0};MDECK=legs[0];drawMap();step2()}
function step2(){if(!WALK||!MROUTE)return;const now=performance.now(),dt=Math.min(.05,(now-WALK.t0)/1000);WALK.t0=now;const d=WALK.legs[WALK.leg],seg=MROUTE.segs[d];if(!seg){stopWalk2();return}
 if(MDECK!=d){MDECK=d;drawMap()}
 const P=poly(seg),L=plen(P),g=document.getElementById("wkr");
 if(WALK.pause>0){WALK.pause-=dt;profMan(null,X2T(MROUTE.k.x),1-Math.max(0,WALK.pause)/2.4);if(WALK.pause<=0){WALK.leg++;WALK.s=0;if(WALK.leg<WALK.legs.length){MDECK=WALK.legs[WALK.leg];drawMap()}}WALK.raf=requestAnimationFrame(step2);return}
 WALK.s+=dt*260;const q=pat(P,Math.min(WALK.s,L));
 WALK.ph=(WALK.ph||0)+dt*11;const sw=Math.sin(WALK.ph)*28;[["mLG1",sw,-14],["mLG2",-sw,-14],["mAR1",-sw*.8,-26],["mAR2",sw*.8,-26]].forEach(([id,a,y])=>{const e=document.getElementById(id);if(e)e.setAttribute("transform",`rotate(${a} 0 ${y})`)});const ar=document.getElementById("wka");if(ar){ar.style.display="";const ah=pat(P,Math.min(WALK.s+30,L));ar.setAttribute("transform",`translate(${q.x},${q.y}) rotate(${ah.ang}) translate(30,0)`)}const face=document.getElementById("wks");if(face){const sa=WIDE?q.ang+90:FLIP?q.ang+180:q.ang;const fx=Math.cos(sa*Math.PI/180)<-.2?-1:1;face.setAttribute("transform",`scale(${1.45*fx},1.45)`)}profMan(d,q.y/25.6,null);if(g){g.style.display="";g.setAttribute("transform",`translate(${q.x},${q.y})`+(WIDE?" rotate(90)":FLIP?" rotate(180)":""));const M=document.getElementById("map"),svg=M.querySelector(".mv svg");if(svg){const k=svg.getBoundingClientRect().height/2570;if(WIDE){const kw=svg.getBoundingClientRect().width/2570;M.scrollLeft=Math.max(0,q.y*kw-M.clientWidth*.45)}else M.scrollTop=Math.max(0,(FLIP?2570-q.y:q.y)*k-M.clientHeight*.4)}}
 const dir=document.getElementById("dir");
 if(WALK.s>=L){if(WALK.leg<WALK.legs.length-1){const up=MROUTE.b.d>MROUTE.a.d;showDir((up?"⬆ Take Elevator "+MROUTE.k.c+" UP to Deck ":"⬇ Take Elevator "+MROUTE.k.c+" DOWN to Deck ")+MROUTE.b.d);WALK.pause=2.4}else{showDir("✔ You have arrived at "+MROUTE.b.n);stopWalk2();return}}
 else showDir((WALK.leg==0?"🚶 Walk to ":"🚶 Deck "+d+": walk to ")+(WALK.leg<WALK.legs.length-1?"Elevator "+MROUTE.k.c+" ("+(MROUTE.k.x<0?"forward":"aft")+" lobby)":MROUTE.b.n));
 WALK.raf=requestAnimationFrame(step2)}

document.getElementById("mo").onclick=()=>document.getElementById("more").classList.toggle("open");initMap();info(document.getElementById("info").innerHTML);
document.getElementById("spin").onclick=e=>{SPIN=!SPIN;e.target.textContent=SPIN?"■ Stop spin":"⟲ Spin 360°"};document.getElementById("tv").onclick=()=>{ph=.12;th=Math.PI/2;rad=Math.min(rad,420);if(dk.value=="all"){dk.value="5";vis()}tgt.set(0,Y(+dk.value),0)};
addEventListener("resize",size);build();size();let T0=performance.now();(function loop(t){walk(Math.min(.1,(t-T0)/1000||0));if(SPIN)th+=Math.min(.1,(t-T0)/1000||0)*.5;T0=t;cam();R.render(S,CAM);requestAnimationFrame(loop)})(performance.now());
